<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan - KOPIKU</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="container header-inner">
      <h1>KOPIKU</h1>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="pesan.html">Pesan</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Form Pemesanan</h2>
    <p>Isi data di bawah ini untuk memesan minuman pilihanmu.</p>

    <form class="form-pesan" method="get" action="pesan.html">
      <div class="form-group">
        <label for="nama">Nama Pemesan:</label>
        <input type="text" id="nama" name="nama" required>
      </div>

      <div class="form-group">
        <label for="whatsapp">Nomor WhatsApp:</label>
        <input type="tel" id="whatsapp" name="whatsapp" placeholder="081234567890" required>
      </div>

      <div class="form-group">
        <label for="menu">Pilihan Menu:</label>
        <select id="menu" name="menu" required>
          <option value="">Pilih Menu</option>
          <optgroup label="Kopi">
            <option value="Espresso">Espresso  Rp15.000</option>
            <option value="Es Kopi Susu Gula Aren">Es Kopi Susu Gula Aren  Rp22.000</option>
            <option value="Caffe Latte">Caffe Latte  Rp25.000</option>
          </optgroup>
          <optgroup label="Non-Kopi">
            <option value="Matcha Latte">Matcha Latte  Rp24.000</option>
            <option value="Signature Chocolate">Signature Chocolate  Rp23.000</option>
            <option value="Lychee Tea">Lychee Tea  Rp18.000</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label for="jumlah">Jumlah:</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="10" value="1" required>
      </div>

      <fieldset class="form-group">
        <legend>Cara Ambil:</legend>
        <div class="radio-option">
          <input type="radio" id="ambil-tempat" name="cara_ambil" value="Ambil di tempat" required>
          <label for="ambil-tempat">Ambil di tempat</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="diantar" name="cara_ambil" value="Diantar">
          <label for="diantar">Diantar</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="catatan">Catatan:</label>
        <textarea id="catatan" name="catatan" rows="4" cols="35" placeholder="Contoh: less sugar, es dipisah ya kak"></textarea>
      </div>

      <button type="submit">Kirim</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>Alamat: Jl. Baru No. 10, Semarang</p>
      <p>Jam Buka: Setiap hari, 08.00 – 24.00 WIB</p>
    </div>
  </footer>

</body>
</html>
